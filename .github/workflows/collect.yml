name: 抓取最热

on:
  schedule:
    # 兜底用。GitHub 的定时常常几个小时才跑一次（上线头一天 20 小时只跑了 3 次），
    # 平时靠 Cloudflare Worker（trigger/）每小时第 17 分钟准点调下面的 workflow_dispatch。
    # 两边碰到同一小时就多跑一次，每次抓到的并进当天的存档，不碍事。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 不让两次抓取同时提交。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 抓取网站的「最热」
        run: node collector/collect.mjs
      - name: 提交数据
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hot
          if git diff --cached --quiet; then
            echo '数据没有变化'
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
      - name: 打包 Pages
        # 站点绑在 hot.ryusaksun.com 上，存档放在根目录：https://hot.ryusaksun.com/<年>-<月>-<日>.json。
        run: |
          mkdir -p _site
          cp hot/*.json _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
